<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34c759;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30d158;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />
  <!-- 圆形 -->
  <circle cx="100" cy="120" r="60" fill="url(#grad1)" />
  <text x="100" y="126" font-size="16" font-family="-apple-system, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">圆形 A</text>
  <!-- 连线与箭头 -->
  <line x1="170" y1="120" x2="250" y2="120" stroke="#86868b" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="250,114 262,120 250,126" fill="#86868b" />
  <!-- 矩形 -->
  <rect x="270" y="70" width="140" height="100" rx="8" fill="url(#grad2)" />
  <text x="340" y="126" font-size="16" font-family="-apple-system, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">处理模块 B</text>
  <!-- 连线与箭头 -->
  <line x1="420" y1="120" x2="490" y2="120" stroke="#86868b" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="490,114 502,120 490,126" fill="#86868b" />
  <!-- 多边形/钻石菱形 -->
  <polygon points="550,60 590,120 550,180 510,120" fill="#ff9500" />
  <text x="550" y="126" font-size="14" font-family="-apple-system, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">判定 C</text>
</svg>
